org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
org.gradle.parallel=true
org.gradle.caching=true

# Fix: Kotlin incremental cache breaks when project (D:) and pub cache (C:)
# are on different Windows drives — relative paths can't span drive letters.
kotlin.incremental=false
kotlin.incremental.java=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Suppress warnings about plugins still using legacy Kotlin Gradle Plugin
# (flutter_tts, share_plus, etc.) — not fixable until plugin authors update.
android.suppressUnsupportedCompileSdkVersionCheck=true
kotlin.suppressGradlePluginWarnings=true

# Skip Flutter's Gradle version validation — 8.13 works fine with AGP 8.11.1;
# Flutter's minimum (8.14) doesn't yet exist as a release.
android.suppressUnsupportedOptionWarnings=org.gradle.warning.mode
